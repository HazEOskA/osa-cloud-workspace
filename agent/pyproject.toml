[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "osa-cloud-agent"
version = "0.1.0"
description = "Read-only ADK supervisor for OSA Cloud Workspace"
requires-python = ">=3.12"
dependencies = [
  "google-cloud-aiplatform[agent_engines,adk]>=1.112,<3",
  "google-auth>=2.40,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["osa_cloud_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
